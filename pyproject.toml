[project]
name = "easun-rwb1-esphome"
version = "0.1.0a1"
description = "Read-only EASUN RWB1 Bluetooth telemetry for ESPHome"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "EASUN RWB1 ESPHome contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Home Automation",
]

[project.optional-dependencies]
ble-tools = [
  "bleak>=1.0,<2",
  "cryptography>=45,<47",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
