substitutions:
  update_interval: 2s

esphome:
  name: easun-rwb1-validation
  friendly_name: EASUN RWB1 Validation

esp32:
  board: esp32-c3-devkitm-1
  flash_size: 4MB
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG
  level: DEBUG

external_components:
  - source:
      type: local
      path: ../components
    components: [rwb1_ble]

esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 1100ms
    active: true

rwb1_ble:
  dtu_id: !secret rwb1_dtu_id
  update_interval: ${update_interval}
  activity_led:
    number: GPIO8
    inverted: true
    ignore_strapping_warning: true
  status_code:
    name: Status Code
  grid_voltage:
    name: Grid Voltage
  grid_frequency:
    name: Grid Frequency
  pv_voltage:
    name: PV Voltage
  pv_power:
    name: PV Power
  battery_voltage:
    name: Battery Voltage
  battery_soc:
    name: Battery State of Charge
  battery_charge_current:
    name: Battery Charge Current
  battery_discharge_current:
    name: Battery Discharge Current
  output_voltage:
    name: Output Voltage
  output_frequency:
    name: Output Frequency
  load_apparent_power:
    name: Load Apparent Power
  load_active_power:
    name: Load Active Power
  load_percent:
    name: Load Percentage
  rated_power:
    name: Rated Power
