# Copy these names to the secrets.yaml managed by ESPHome. Never commit the
# real values. The ESPHome dashboard normally creates the Wi-Fi/API/OTA values.
wifi_ssid: "YOUR_WIFI_NAME"
wifi_password: "YOUR_WIFI_PASSWORD"
api_encryption_key: "GENERATE_IN_ESPHOME_DASHBOARD"
ota_password: "GENERATE_IN_ESPHOME_DASHBOARD"
# Copy the complete value from the vendor app's Device Information -> DTU ID.
# Do not use the SN, SSL_ Bluetooth name or Bluetooth MAC address.
rwb1_dtu_id: "YOUR_RWB1_DTU_ID"
